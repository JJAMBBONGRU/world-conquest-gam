<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>세계 정복 대작전</title>
<meta name="theme-color" content="#070b14">
<style>
:root{--bg:#070b14;--panel:rgba(13,19,33,.94);--panel2:#111a2c;--ink:#e7ecf5;--sub:#8b97ad;--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.26);--accent:#e8b44c;--accent2:#f5d07a;--good:#2fbf71;--bad:#e5484d;--blue:#3b82f6;--cyan:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 40%,#13284a 0%,#0a1628 55%,#050a14 100%);color:var(--ink);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;color:inherit}
svg.i{width:1.05em;height:1.05em;vertical-align:-.17em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip svg.i{color:var(--accent2)}
h3 svg.i,h4 svg.i,.t svg.i{color:var(--accent)}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:7px 10px;padding-top:max(7px,env(safe-area-inset-top));display:none;gap:6px;align-items:center;background:linear-gradient(180deg,rgba(7,11,20,.96),rgba(7,11,20,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.chip small{font-weight:600;font-size:11px}
.pos{color:#4ade80}.neg{color:#f87171}
#tabs{position:fixed;left:0;right:0;bottom:0;display:none;background:rgba(7,11,20,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:7;padding:4px 4px env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:7px 0 6px;font-size:20px;line-height:1;color:var(--sub);border-radius:10px;position:relative}
#tabs button span{display:block;font-size:10.5px;font-weight:700;margin-top:4px;letter-spacing:.02em}
#tabs button.on{color:var(--accent2);background:linear-gradient(180deg,rgba(232,180,76,.16),rgba(232,180,76,.04))}
#tabs button.on:after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent)}
#panel{position:fixed;left:0;right:0;bottom:60px;max-height:54vh;overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);z-index:6;padding:14px 14px 20px;display:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet{position:fixed;left:8px;right:8px;bottom:68px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.55);z-index:8;padding:14px;display:none;border:1px solid var(--line2);max-height:60vh;overflow-y:auto}
@media(min-width:900px){
 #panel{left:auto;right:12px;top:60px;bottom:80px;width:420px;max-height:none;border-radius:16px;border-bottom:1px solid var(--line)}
 #tabs{left:auto;right:12px;width:420px;bottom:10px;border-radius:14px;border:1px solid var(--line)}
 #sheet{left:12px;right:auto;width:380px;bottom:16px}
}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:6px}
h3{margin:2px 0 10px;font-size:18px;font-weight:800;letter-spacing:-.02em}
h4{margin:16px 0 7px;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.card.lock{opacity:.5}
.card .t{font-weight:800;font-size:15px}
.card .s{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
.btn{border:0;border-radius:9px;padding:8px 13px;font-weight:800;font-size:14px;background:linear-gradient(180deg,#f2c35e,#d99a2b);color:#1a1205;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 12px rgba(217,154,43,.25);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.g{background:linear-gradient(180deg,#3fd184,#21995a);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px rgba(47,191,113,.22)}
.btn.b{background:linear-gradient(180deg,#5b9bff,#2f6fe0);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px rgba(59,130,246,.25)}
.btn.r{background:linear-gradient(180deg,#f0656a,#c8343a);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px rgba(229,72,77,.25)}
.btn.w{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{background:rgba(255,255,255,.07);color:#5b667a;box-shadow:none;border:1px solid var(--line)}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d99a2b,#f5d07a);border-radius:99px;box-shadow:0 0 10px rgba(245,208,122,.4)}
.bar.g i{background:linear-gradient(90deg,#21995a,#4ade80);box-shadow:0 0 10px rgba(74,222,128,.35)}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.3);vertical-align:-1px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(232,180,76,.15);color:var(--accent2);margin-left:4px;letter-spacing:.02em}
.tag.inf{background:rgba(47,191,113,.15);color:#4ade80}.tag.war{background:rgba(229,72,77,.16);color:#f87171}.tag.ally{background:rgba(59,130,246,.16);color:#7fb0ff}
.muted{color:var(--sub);font-size:12px}
b{font-weight:800}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
#toast div{background:rgba(13,19,33,.95);border:1px solid var(--line2);border-left:3px solid var(--accent);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;text-align:center;animation:pop .22s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.45)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
#feed{position:fixed;left:8px;bottom:68px;z-index:4;max-width:62%;pointer-events:none;display:none}
#feed div{background:rgba(7,11,20,.78);border:1px solid var(--line);border-left:2px solid var(--cyan);color:#cbd5e1;border-radius:6px;padding:4px 9px;margin-top:4px;font-size:12px;font-weight:600}
.screen{position:fixed;inset:0;z-index:30;background:radial-gradient(90% 60% at 50% 0%,rgba(232,180,76,.16),transparent 60%),radial-gradient(120% 90% at 50% 100%,#10264a,#060a14 70%);overflow-y:auto;display:flex;justify-content:center;padding:22px 14px 40px}
.screen .box{width:100%;max-width:520px}
.title{font-size:36px;font-weight:900;text-align:center;margin:22px 0 4px;letter-spacing:-.03em;background:linear-gradient(180deg,#fff3cf,#e8b44c 60%,#b9781c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(232,180,76,.35))}
.sub{text-align:center;color:var(--sub);font-weight:600;margin-bottom:20px;letter-spacing:.04em}
.big{display:flex;width:100%;margin:10px 0;padding:16px;font-size:17px;border-radius:12px}
.scen{display:block;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:12px;padding:14px;margin:9px 0;color:var(--ink)}
.scen.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(232,180,76,.14),rgba(232,180,76,.04));box-shadow:0 0 0 1px rgba(232,180,76,.35),0 8px 24px rgba(232,180,76,.12)}
.scen b{font-size:17px}
input[type=text],input[type=number],input[type=password],select{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:9px;border:1px solid var(--line2);width:100%;background:rgba(255,255,255,.05);color:var(--ink)}
select option{background:#111a2c;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(2,5,12,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:linear-gradient(180deg,#152038,#0d1424);border:1px solid var(--line2);border-top:2px solid var(--accent);border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal h2{margin:4px 0 10px;font-size:20px;letter-spacing:-.02em}
.modal p{color:#c3cbd9;line-height:1.55}
.nlist{max-height:30vh;overflow-y:auto}
.ic{vertical-align:middle;margin:-4px 3px -2px 0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.aimbar{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9;background:linear-gradient(180deg,#f0656a,#c8343a);color:#fff;font-weight:800;padding:9px 16px;border-radius:10px;display:none;box-shadow:0 8px 24px rgba(229,72,77,.35)}
a{color:var(--cyan)}
/* 밝은 테마 */
body.light{--panel:rgba(255,255,255,.95);--panel2:#fff;--ink:#1b2333;--sub:#5b6880;--line:rgba(30,41,59,.12);--line2:rgba(30,41,59,.22);--accent:#c4841a;--accent2:#a96d0c;--cyan:#0284c7;background:radial-gradient(120% 90% at 50% 40%,#cfe9fb 0%,#a9d6f5 55%,#87c2ec 100%)}
body.light #top{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.88))}
body.light #tabs{background:rgba(255,255,255,.97)}
body.light #tabs button.on{background:linear-gradient(180deg,rgba(196,132,26,.16),rgba(196,132,26,.04))}
body.light .chip{background:rgba(15,23,42,.04)}
body.light .card,body.light .scen{background:linear-gradient(180deg,#ffffff,#f6f8fb)}
body.light .scen.on{background:linear-gradient(180deg,#fff7e6,#fff0d1)}
body.light #panel,body.light #sheet{box-shadow:0 -8px 30px rgba(15,23,42,.18)}
body.light .btn.w{background:rgba(15,23,42,.05);color:var(--ink)}
body.light .btn:disabled{background:rgba(15,23,42,.06);color:#9aa4b5}
body.light .bar{background:rgba(15,23,42,.09)}
body.light .pos{color:#15803d}body.light .neg{color:#dc2626}
body.light .tag{background:rgba(196,132,26,.14);color:#94600a}body.light .tag.inf{background:rgba(22,163,74,.12);color:#15803d}body.light .tag.war{background:rgba(220,38,38,.12);color:#b91c1c}body.light .tag.ally{background:rgba(37,99,235,.12);color:#1d4ed8}
body.light #toast div{background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.18)}
body.light #feed div{background:rgba(255,255,255,.9);color:#334155;border-color:rgba(30,41,59,.12)}
body.light .screen{background:radial-gradient(90% 60% at 50% 0%,rgba(245,190,90,.35),transparent 60%),radial-gradient(120% 90% at 50% 100%,#d9eefc,#f6fbff 70%)}
body.light .title{background:linear-gradient(180deg,#e0a43a,#b06a0c 70%,#7a4506);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 10px rgba(176,106,12,.25))}
body.light input[type=text],body.light input[type=number],body.light input[type=password],body.light select{background:#fff}
body.light select option{background:#fff;color:#1b2333}
body.light .modal{background:rgba(15,23,42,.35)}
body.light .modal .box{background:linear-gradient(180deg,#ffffff,#f4f7fb);box-shadow:0 24px 60px rgba(15,23,42,.3)}
body.light .modal p{color:#475569}
body.light .chip svg.i{color:var(--accent)}
#ending{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(70% 55% at 50% 42%,rgba(232,180,76,.22),rgba(5,8,16,.94) 70%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px}
#ending .rays{position:absolute;left:50%;top:40%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(245,208,122,.10) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#ending canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ending .eb{position:relative;width:100%;max-width:440px;text-align:center}
#ending .ek{font-size:13px;letter-spacing:.35em;color:var(--accent);font-weight:800;opacity:0;animation:up .8s .2s forwards}
#ending .et{font-size:48px;font-weight:900;letter-spacing:-.03em;margin:6px 0 2px;background:linear-gradient(180deg,#fff7dc,#f5d07a 45%,#c9861e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(232,180,76,.5));opacity:0;animation:zoom 1s .5s cubic-bezier(.2,1.4,.4,1) forwards}
#ending .en{font-size:20px;font-weight:800;color:#fff;opacity:0;animation:up .8s 1.1s forwards}
#ending .es{color:#c3cbd9;font-size:14px;line-height:1.6;margin:10px 0 14px;opacity:0;animation:up .8s 1.4s forwards}
#ending .grade{display:flex;justify-content:center;gap:8px;margin:8px 0 14px}
#ending .grade svg{width:38px;height:38px;opacity:0;animation:pop2 .5s forwards}
#ending .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
#ending .stats div{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:10px;padding:10px 6px;opacity:0;animation:up .6s forwards}
#ending .stats b{display:block;font-size:19px;color:var(--accent2);font-variant-numeric:tabular-nums}
#ending .stats span{font-size:11.5px;color:var(--sub)}
#ending .btns{opacity:0;animation:up .6s 3s forwards}
#ending.lose{background:radial-gradient(70% 55% at 50% 42%,rgba(120,140,170,.18),rgba(5,8,16,.95) 70%)}
#ending.lose .et{background:linear-gradient(180deg,#e5e9f0,#8b97ad);-webkit-background-clip:text;background-clip:text;filter:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes pop2{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="top"></div>
<div id="feed"></div>
<div id="panel"></div>
<div id="sheet"></div>
<div id="aimbar" class="aimbar"></div>
<div id="tabs">
 <button data-tab="home"><svg class="i" viewBox="0 0 24 24" data-k="home"></svg><span>우리나라</span></button>
 <button data-tab="army"><svg class="i" viewBox="0 0 24 24" data-k="soldier"></svg><span>군대</span></button>
 <button data-tab="tech"><svg class="i" viewBox="0 0 24 24" data-k="flask"></svg><span>연구</span></button>
 <button data-tab="build"><svg class="i" viewBox="0 0 24 24" data-k="build"></svg><span>건설</span></button>
 <button data-tab="diplo"><svg class="i" viewBox="0 0 24 24" data-k="globe"></svg><span>외교</span></button>
 <button data-tab="menu"><svg class="i" viewBox="0 0 24 24" data-k="gear"></svg><span>메뉴</span></button>
</div>
<div id="toast"></div>
<div id="ending"><div class="rays"></div><canvas id="fw"></canvas><div class="eb" id="endbox"></div></div>
<div id="menu" class="screen"><div class="box" id="menubox"></div></div>
<div id="modal" class="modal" style="display:none"><div class="box" id="modalbox"></div></div>

<script>
'use strict';
/* =========================================================
   세계 정복 대작전 — 실시간 세계 전략 게임 (HTML 한 파일)
   ========================================================= */

const ICP={
coin:'<circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2c-.5-1-1.6-1.5-2.8-1.5-1.6 0-2.8.8-2.8 2.1 0 2.9 5.8 1.5 5.8 4.4 0 1.3-1.2 2.1-3 2.1-1.3 0-2.4-.5-3-1.5M12 6v1.7M12 16.3V18"/>',
users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.3.2 4 1.6 4.5 4.3"/>',

swords:'<path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 6.5 6 3H3v3l3.5 3.5M5 14l-1 1 5 5 1-1M7 17l-3 3"/>',

oil:'<path d="M12 3s6 6.7 6 11a6 6 0 0 1-12 0c0-4.3 6-11 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/>',

ship:'<path d="M3 15l2 5h14l2-5H3zM6 15V9h12v6M9 9V5h6v4"/><path d="M2 21c1.5 0 1.5-1 3-1s1.5 1 3 1"/>',
sat:'<rect x="9.5" y="9.5" width="5" height="5" rx="1" transform="rotate(45 12 12)"/><path d="M8 8 5 5M16 16l3 3"/><rect x="1.5" y="1.5" width="5" height="5" transform="rotate(45 4 4)"/><rect x="17.5" y="17.5" width="5" height="5" transform="rotate(45 20 20)"/><path d="M15.5 4.5a4 4 0 0 1 4 4"/>',
rocket:'<path d="M5 19c1-3 2.5-4.5 4-5l1 1c-.5 1.5-2 3-5 4z"/><path d="M14.5 4.5C17 2.5 21 3 21 3s.5 4-1.5 6.5L13 16l-5-5z"/><circle cx="15.5" cy="8.5" r="1.4"/><path d="M8 11H5l2-3h4M13 16v3l3-2v-4"/>',
pick:'<path d="M4 9c3-4 9-6 16-5-4 1-8 3-11 6"/><path d="M12.5 8.5 20 20M10 11l8.5 8.5"/>',
shield:'<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/>',

hand:'<path d="M2 12l4-4 4 2 3-2 3 1 4-2 2 5-5 5-3 1-3-2-4 0z"/><path d="M10 10l3 3M13 9.5l3 3"/>',
flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',

// 그림 보관함: 같은 그림·같은 색은 한 번만 그려요
const SPR_CACHE=new Map(),SPR_URL=new Map(),SPR_PX=96;
function spr(name,rgb,opt){rgb=rgb||[70,120,200];const key=name+'|'+rgb.join(',')+(opt&&opt.old?'|o':'');let c=SPR_CACHE.get(key);if(c)return c;
 c=document.createElement('canvas');c.width=c.height=SPR_PX;const g=c.getContext('2d');g.scale(SPR_PX/64,SPR_PX/64);try{(SPRITES[name]||SPRITES.militia)(g,rgb,opt);}catch(e){}SPR_CACHE.set(key,c);return c;}
function sprUrl(name,rgb,opt){const key=name+'|'+(rgb||[]).join(',')+(opt&&opt.old?'|o':'');let u=SPR_URL.get(key);if(!u){u=spr(name,rgb,opt).toDataURL();SPR_URL.set(key,u);}return u;}
function sprImg(name,rgb,opt,size){return`<img class="ic" src="${sprUrl(name,rgb,opt)}" style="width:${size||30}px;height:${size||30}px" alt="">`;}
// 지도 위에 그리기 (flip: 왼쪽을 보게)
function drawSpr(name,rgb,x,y,size,flip,opt){const c=spr(name,rgb,opt);if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(c,-size/2,-size/2,size,size);ctx.restore();}else ctx.drawImage(c,x-size/2,y-size/2,size,size);}

function kidGuard(){for(const M of G.nations){if(!kid(M)||!M.alive)continue;for(let id=1;id<G.nations.length;id++){if(!G.war[M.id][id])continue;const N=G.nations[id];
 if((M.gain[id]||0)<=-4||M.cells<(M.peakCells||M.cells)*0.85){makePeace(M.id,id);if(M.id===ME)toast('🕊️ 쉬움 모드 보호: 지고 있어서 '+N.name+'와(과) 평화를 맺었어요. 군대를 더 키워서 다시 도전해요!');}}}}
function aiDay(){
 kidGuard();
 for(const N of G.nations){if(N&&N.alive&&N.human&&(G.day+N.id)%5===0)autoHelper(N);}
 for(const N of G.nations){if(!N||!N.alive||N.human)continue;
  if((G.day+N.id)%5===0)aiEcon(N);

  if((G.day+N.id)%15===0)aiPeace(N);
  if(N.sats>=1&&(N.satCd||0)<=G.day&&warCount(N)&&rnd()<0.2){const en=[];for(let j=1;j<G.nations.length;j++)if(G.war[N.id][j]&&!kid(G.nations[j]))en.push(j);if(en.length){const E=G.nations[pick(en)];if(E.cap>=0)snipe(N,E.cap);}}
 if(G.nuke&&!N.human&&warCount(N)&&(G.day+N.id)%30===0&&N.stab<45&&rnd()<0.15){const nk=UNITS.findIndex((u,k)=>u.nuke&&N.units[k]>=1);if(nk>=0){const en=[];for(let j=1;j<G.nations.length;j++)if(G.war[N.id][j]&&!kid(G.nations[j])&&G.nations[j].cap>=0)en.push(j);if(en.length){const E=G.nations[pick(en)];const ci=CITIES.findIndex(C=>G.owner[C.c]===E.id);fireMissile(N,nk,ci>=0?CITIES[ci].c:E.cap);}}}
 if(N.mis>=1&&(G.day+N.id)%20===0&&warCount(N)){const en=[];for(let j=1;j<G.nations.length;j++)if(G.war[N.id][j])en.push(j);const E=G.nations[pick(en)];if(kid(E))continue;
   const k=bestUnits(N,'mis').find(k=>N.units[k]>=1&&!UNITS[k].nuke);if(k!=null&&E.cap>=0)fireMissile(N,k,E.cap);}}
 if(G.day%30===0)for(let a=1;a<G.nations.length;a++)for(let b=1;b<G.nations.length;b++){if(a===b||G.war[a][b])continue;const v=G.rel[a][b];if(v>5)G.rel[a][b]--;else if(v<-5)G.rel[a][b]++;}
 G.offers=G.offers.filter(o=>G.day-o.day<45);

function aiEcon(N){
 aiResearch(N);
 if(N.dmgFac>0&&N.money>repairCost(N)*1.5){N.money-=repairCost(N);N.dmgFac=0;}
 const r=N.rate;if(N.occ>0.5)N.pol=N.money>r.up*60&&N.occ>N.cells*0.2?2:1;
 if(r.money<0)N.tax=Math.min(0.4,N.tax+0.02);else if(N.tax>0.22&&N.stab<50)N.tax-=0.01;

 if(rnd()<0.12){const k=pick(UPG_IDS),c=upCost(N,k);N.up=N.up||{};if(U(N,k)<UPG_MAX&&budget>c*1.5){N.money-=c;budget-=c;N.up[k]=U(N,k)+1;}}

function aiBuild(N,budget){const r=N.rate;
 const opts=[];if(r.food<N.pop*0.03||r.foodBuy>0)opts.push('farm','farm','farm');if(r.oil<0&&N.techs.engine)opts.push('well','port','well','port');
 opts.push('factory','factory','lab','town','mine','barracks','port','farm');if(N.techs.shield)opts.push('airdef');if(N.techs.medicine)opts.push('hospital');
 for(let t=0;t<4;t++){const b=t<opts.length&&(r.food<N.pop*0.03||r.foodBuy>0||r.oil<0)?opts[t]:pick(opts);const pl=planBuild(N,b);if(pl.e)continue;const c=bldCost(N,b,pl.i);if(c<budget*0.5){doBuild(N,b,pl.i);budget-=c;break;}}

function aiArmy(N,budget,lim){const r=N.rate,inc=r.tax+r.fac+r.port+r.gold;let upk=r.up;
 for(let t=0;t<4&&upk<inc*lim&&budget>0;t++){
  const k=pickUnit(N);if(k==null)break;const u=UNITS[k];const n=Math.max(1,Math.floor(Math.min(budget*0.5/u.cost,5)));
  if(canTrain(N,k,n))break;doTrain(N,k,n);budget-=u.cost*n;upk+=u.cost*n*0.002;}
}
function pickUnit(N){
 let qi=0,qs=0;for(const q of N.queue){const u=UNITS[q.k];if(u.c==='land'){if(u.inf)qi+=q.n;else qs+=q.n;}}
 const inc=N.rate.tax+N.rate.fac+N.rate.port+N.rate.gold,thirsty=N.oilShort||(N.rate.oilBuy||0)>inc*0.25;
 const tryC=cls=>bestUnits(N,cls).find(k=>!canTrain(N,k,1)&&!(thirsty&&UNITS[k].oil>0.6));
 let k=null;if(N.infC+qi<(N.supC+qs)*0.8+3)k=tryC('inf');
 if(k==null){const x=rnd();const war=warCount(N)>0;
  if(x<0.35)k=tryC('sup');else if(x<0.55)k=tryC('air');else if(x<0.72&&N.coast>0)k=tryC('sea');else if(x<0.82&&war){k=tryC('mis');if(k!=null&&UNITS[k].nuke&&(N.units[k]>=2||rnd()>0.2))k=null;}}
 if(k==null&&N.techs.satellite&&(N.sats||0)<2&&rnd()<0.1)k=tryC('sat');
 if(k==null)k=tryC('inf');return k;
}
function aiWar(N){
 if(warCount(N)>=(N.aggr>0.7?2:1)||N.weary>30)return;
 let best=null,bs=0;
 for(const id of N._nbr){const M=G.nations[id];if(!M||!M.alive||G.war[N.id][id]||G.ally[N.id][id]||G.truce[N.id][id]>G.day)continue;
  let s=(N.landAtk+1)/(M.landDef+1)*(0.5+N.aggr)-G.rel[N.id][id]/50;

  if(M.human){if(G.diff===0||(G.diff===1&&G.day<365))continue;s*=[0,0.8,1.3][G.diff];}
  if(s>bs){bs=s;best=M;}}
 if(best&&bs>2.5&&rnd()<N.aggr*0.25)declareWar(N.id,best.id);

}

function canTrain(N,k,n){const u=UNITS[k];if(!u)return'없는 부대예요';
 if(u.c==='sea'&&!N.allUnits){if(N.coastCity===false)return'⚓ 해안 도시가 있어야 배를 만들 수 있어요';if(['galley','frigate'].includes(u.id)&&N.timber===false)return'🌲 나무배는 산이나 숲이 가까운 해안 도시가 있어야 만들 수 있어요';}if(!N.allUnits&&obsUp(N,k)>=0)return`${u.n}은(는) 구식이 되어 ${UNITS[obsUp(N,k)].n}(으)로 업그레이드되고 있어요`;if(u.only&&!hasTrait(N,u.only)&&!N.allUnits)return u.only==='gg'?'🐴 고구려만 만들 수 있어요':'🐎 몽골만 만들 수 있어요';if(!unlocked(N,k))return`🔒 「${TECH[u.t].n}」 연구가 필요해요`;
 if(u.c==='sea'&&!N.coast)return'바다에 닿은 땅이 없어요';if(N.queue.length>=20)return'훈련 줄이 꽉 찼어요 (최대 20)';
 if(N.money<u.cost*n)return'💰 돈이 부족해요';if(N.iron<(u.fe||0)*n)return'⛏️ 철이 부족해요';if(N.mp<u.mp*n)return'👨‍👩‍👧 병사가 될 사람이 부족해요';
 if(u.tl&&availUnits(N,'land')<u.tl*n)return`🪖 배에 태울 병사가 ${r1(u.tl*n)}부대 필요해요 (지금 ${r1(availUnits(N,'land'))}부대)`;
 if(u.ta&&availUnits(N,'air')<u.ta*n)return`✈️ ${u.n}에 태울 비행기가 ${r1(u.ta*n)}대 필요해요 (지금 ${r1(availUnits(N,'air'))}대)`;return null;}
function doTrain(N,k,n){const u=UNITS[k];if(N.human)N.stat.trained=(N.stat.trained||0)+n;N.money-=u.cost*n;N.iron-=(u.fe||0)*n;N.mp-=u.mp*n;const d=Math.round(u.days);
 let mv=null;if(u.tl||u.ta){N.emb=N.emb||new Array(UNITS.length).fill(0);mv=new Array(UNITS.length).fill(0);
  if(u.tl){const m=moveUnits(N,'land',u.tl*n,N.units,N.emb);m.forEach((v,i)=>mv[i]+=v);}if(u.ta){const m=moveUnits(N,'air',u.ta*n,N.units,N.emb);m.forEach((v,i)=>mv[i]+=v);}}
 const q=N.queue.find(q=>q.k===k&&q.left===q.tot);if(q){q.n+=n;if(mv){q.mv=q.mv||new Array(UNITS.length).fill(0);mv.forEach((v,i)=>q.mv[i]+=v);}}else N.queue.push({k,n,left:d,tot:d,mv});}
function planBuild(N,b,i){const B=BLD[b];if(!B)return{e:'없는 건물이에요'};if(B.t&&!N.techs[B.t])return{e:`🔒 「${TECH[B.t].n}」 연구가 필요해요`};if(N.bld[b]>=bldCap(N,b))return{e:'더 지을 수 없어요 (땅을 넓혀 보세요)'};
 if(i==null||i<0){i=bestCell(N,b);if(i<0)return{e:'지을 수 있는 칸이 없어요 (땅을 넓혀 보세요)'};}else{const e=cellOk(N,b,i);if(e)return{e};}
 if(N.money<bldCost(N,b,i))return{e:'💰 돈이 부족해요',i};return{e:null,i};}
function canBuild(N,b,i){return planBuild(N,b,i).e;}

const ZONES={agri:{n:'농업단지',e:'🌾',l:['farm','farm','farm','town','farm'],d:'농장·마을 — 식량이 늘어 사람이 많아져요'},home:{n:'주택단지',e:'🏘️',l:['town','hospital','town','farm'],d:'마을·병원·농장 — 사람이 늘어요'},
 fac:{n:'공업단지',e:'🏭',l:['factory','factory','barracks','lab'],d:'공장·훈련소·연구소 — 돈과 생산이 늘어요'},
 ind:{n:'산업단지',e:'⛏️',l:['mine','well','port','mine','farm'],d:'광산·유전·항구 — 자원이 늘어요'}};
function zoneList(N){return N.techs.industry?['agri','home','fac','ind']:['agri','home'];}
function zoneCells(N,c,R){const cx=c%W,cy=(c/W)|0,out=[];for(let dy=-R;dy<=R;dy++){const y=cy+dy;if(y<0||y>=H)continue;for(let dx=-R;dx<=R;dx++){const i=y*W+((cx+dx)%W+W)%W;if(G.owner[i]===N.id&&LAND[i])out.push([dx*dx+dy*dy,i]);}}out.sort((a,b)=>a[0]-b[0]);return out.map(x=>x[1]);}
function buildZone(N,z,c){const Z=ZONES[z];if(!Z)return'없는 단지예요';if(c==null||G.owner[c]!==N.id)c=N.cap;if(c<0)return'우리 땅을 골라 주세요';
 const cells=zoneCells(N,c,7),budget=N.money*0.8,start=N.money,done={};let n=0,fail=0;
 for(let round=0;round<6&&n<10;round++){let any=false;for(const b of Z.l){if(n>=10)break;const B=BLD[b];if(B.t&&!N.techs[B.t])continue;if(N.bld[b]>=bldCap(N,b))continue;
  let pick=-1;for(const i of cells){if(!cellOk(N,b,i)){pick=i;break;}}if(pick<0)continue;const cost=bldCost(N,b,pick);if(start-N.money+cost>budget){fail++;continue;}
  doBuild(N,b,pick);done[b]=(done[b]||0)+1;n++;any=true;}if(!any)break;}
 if(n){G.zones=G.zones||[];if(!G.zones.some(q=>q.n===N.id&&cellDist(q.c,c)<4))G.zones.push({n:N.id,c,k:z});}
 if(!n)return fail?`💰 ${Z.n}를 지을 돈이 부족해요`:`이 근처에는 ${Z.n}를 지을 자리가 없어요`;
 return`${Z.e} ${Z.n} 완성! ${Object.keys(done).map(b=>BLD[b].n+' '+done[b]+'개').join(', ')} (💰${fmt(start-N.money)})`;}
function doBuild(N,b,i){if(i==null||i<0)i=bestCell(N,b);if(i<0)return;N.money-=bldCost(N,b,i);N.bld[b]++;addBld(i,b,1);}

 case'행복한나라':N.stab=100;N.weary=0;break;case'병사충전':N.mp=N.mpMax;break;

function giveRebels(C,M,frac){const em=eraMul(C);const k=bestUnits(C,'inf')[0];if(k!=null)C.units[k]+=Math.max(2,Math.round(Math.sqrt(C.cells+1)*2*frac));C.money+=60*em;C.mp=C.pop*20;calcMil(C);}
// 왕이 바뀔 때 나라가 쪼개져요
function successionDay(){
 for(const N of G.nations){if(!N||!N.alive||N.ncell<CF*3)continue;
  if(N.reign==null)N.reign=Math.floor((5+rnd()*30)*365);N.reign--;
  if(N.reign===365&&N.id===ME&&succRisk(N)>=0.2)feed(`👑 우리 왕이 나이가 많아요. 1년쯤 뒤에 새 왕이 나와요. 후계 위험: ${riskTxt(succRisk(N))}`);
  if(N.reign>0)continue;N.reign=Math.floor((15+rnd()*20)*365);
  const grow=clamp(N.cells/Math.max(1,N.cells0||N.cells),0.6,3);let p=succRisk(N)*grow/2*(1-0.12*U(N,'adm'))*(kid(N)?0.5:1)*(N.stab<40?1.5:1);
  if(rnd()>=p){if(N.human||N.cells>200)log(`👑 ${N.name}에 새 왕이 즉위했어요. 나라가 평화롭게 이어졌어요.`,[N.id],false);continue;}
  splitNation(N);}
}
function splitNation(N){
 const cells=[...N.cl];if(cells.length<CF*3)return;const cap=N.cap;
 const far=cells.map(c=>[c,cellDist(c,cap)]).sort((a,b)=>b[1]-a[1]);
 const names=(SPLITN[N.name]||[]).filter(nm=>!G.nations.some(x=>x&&x.alive&&x.name===nm));
 if(!names.length){N.stab=Math.max(0,N.stab-20);N.weary=Math.min(100,N.weary+10);if(N.human||N.cells>100)log(`👑 ${N.name}에서 왕위 다툼이 일어났어요! 나라가 크게 흔들려요`,[N.id],N.id===ME);return;}
 const pieces=Math.min(names.length,succRisk(N)>=0.7?2+(rnd()<0.4?1:0):1);const made=[];const used=new Set();
 for(let p=0;p<pieces;p++){
  let seed=-1;for(let t=0;t<40;t++){const c=far[Math.floor(rnd()*Math.max(1,far.length*0.3))][0];if(G.owner[c]===N.id&&!used.has(c)&&made.every(M=>cellDist(c,M.cap)>40)){seed=c;break;}}if(seed<0)break;
  const x=seed%W;const dir=Math.abs((seed/W|0)-(cap/W|0))>Math.abs(nearX(x,cap%W)-cap%W)?(((seed/W)|0)<((cap/W)|0)?'북':'남'):(nearX(x,cap%W)<cap%W?'서':'동');
  const nm=names[p];if(!nm)break;const C=makeNation(nm,null,N);if(!C)break;
  const share=Math.floor(N.ncell*(0.18+rnd()*0.17));const q=[seed],seen=new Set([seed]);let n=0;
  while(q.length&&n<share){const c=q.shift();if(G.owner[c]!==N.id||c===N.cap)continue;setOwner(c,C.id);addCell(C,c,-1);G.core[c]=C.id;addCell(C,c,1);n++;for(const j of NB[c])if(!seen.has(j)){seen.add(j);q.push(j);}}
  if(!n){C.alive=false;continue;}
  C.cap=seed;if(G.owner[seed]!==C.id)C.cap=[...C.cl][0];C.cells0=C.cells;C.lon=lonOf(C.cap%W);C.lat=latOf((C.cap/W)|0);
  const f=C.cells/(C.cells+N.cells);for(let k=0;k<UNITS.length;k++){const m=N.units[k]*f;C.units[k]+=m;N.units[k]-=m;}C.money+=N.money*f;N.money*=1-f;C.mp=C.pop*20;
  for(let j=1;j<G.nations.length;j++){G.rel[C.id][j]=G.rel[j][C.id]=G.rel[N.id][j]||0;}G.rel[C.id][N.id]=G.rel[N.id][C.id]=-50;
  calcMil(C);made.push(C);used.add(seed);
  if(!kid(N)&&rnd()<0.6)declareWar(C.id,N.id);}
 if(made.length){N.stab=Math.max(0,N.stab-15);calcMil(N);MAPDIRTY=true;
  log(`👑 ${N.name}의 왕이 바뀌면서 후계자 다툼이 일어났어요! 나라가 나뉘었어요: ${made.map(M=>M.name).join(', ')}`,[N.id,...made.map(M=>M.id)],true);
  if(N.id===ME)showModal(`<h2>👑 후계자 다툼!</h2><p>새 왕이 즉위하면서 왕자들이 서로 왕이 되겠다고 다퉜어요.<br><b>${esc(made.map(M=>M.name).join(', '))}</b>이(가) 떨어져 나갔어요.</p><p class="muted">🏛️ 행정을 업그레이드하고 안정도를 높게 유지하면 위험이 줄어요. 떨어져 나간 땅은 다시 되찾을 수 있어요!</p><button class="btn g big" onclick="hideModal()">다시 통일하겠어!</button>`);}
}
// 점령지 반란
function rebellionDay(){
 for(const N of G.nations){if(!N||!N.alive||N.occ<0.05)continue;const pol=POL[N.pol||0];
  if((N.pol||0)===2&&N.cells>0)applyLoss(N,'land',0.0006*Math.min(1,N.occ/N.cells*4));
  let lam=0.0025*N.occ*pol.m*(N.stab<40?1.6:1)*(1+N.weary/60)*(kid(N)?0.5:1);if(rnd()>=Math.min(0.5,lam))continue;
  const k=Math.floor(rnd()*N.occSet.size);let c=-1,t=0;for(const x of N.occSet){if(t++===k){c=x;break;}}if(c<0)continue;
  const core=G.core[c];if(!(core>0)||core===N.id||core===SEA){N.occSet.delete(c);continue;}
  // 같은 사람들의 반란을 3번 막으면 그 뒤로는 반란이 일어나지 않아요
  N.crushed=N.crushed||{};const cr=N.crushed[core]||0;if(cr>=3)continue;if(cr>0&&rnd()>Math.pow(0.45,cr))continue;
  const assim=(G.day-G.occDay[c])>(N.pol===3?5475:10950);
  if(assim){const q=[c],seen=new Set([c]);let n=0;while(q.length&&n<CF*4){const x=q.shift();if(G.owner[x]===N.id&&G.core[x]===core){addCell(N,x,-1);G.core[x]=N.id;addCell(N,x,1);n++;for(const j of NB[x])if(!seen.has(j)){seen.add(j);q.push(j);}}}
   if(N.id===ME)feed(`🤝 오래 함께 산 점령지 사람들이 이제 우리 국민이 되었어요!`);continue;}
  const crush=Math.min(0.9,pol.crush+0.45*Math.min(1,N.infC/(N.occ*0.3+3)));
  const C=G.nations[core];
  if(rnd()<crush+cr*0.15){applyLoss(N,'land',0.002+0.0015*(N.pol||0));addFx({k:'r',c});N.crushed[core]=cr+1;if(N.id===ME)feed(cr+1>=3?`🛡️ ${C?C.name+' 사람들의 ':''}반란을 3번 막았어요! 이제 더는 반란을 일으키지 않아요`:`🛡️ ${C?C.name+' 사람들의 ':''}반란을 막았어요! (${cr+1}/3 — 3번 막으면 조용해져요)`);continue;}
  if(!C)continue;const wasDead=!C.alive;
  if(wasDead){const R=makeNation(C.name,C.rgb,null);if(!R)continue;R.techs=Object.assign({},N.techs);}
  const n=captureBlob(c,C.id,N.id,Math.max(3,Math.round(CF*(0.6-0.15*cr))));if(!n)continue;addFx({k:'r',c});
  if(wasDead){C.cap=c;C.cells0=C.cells;giveRebels(C,N,1);if(!kid(N))declareWar(C.id,N.id);}
  log(wasDead?`✊ ${N.name}의 점령지에서 ${C.name} 사람들이 들고 일어나 다시 독립했어요!`:`✊ ${N.name}의 점령지 일부가 반란을 일으켜 ${C.name}(으)로 돌아갔어요!`,[N.id,C.id],wasDead);
  N.stab=Math.max(0,N.stab-2);}
}

const FLAGC=new Map(),FLAGIMG={};
function flagKey(N){if(!N)return null;const nm=N.name,sid=G?G.sid:'';if(G&&G.customFlags&&G.customFlags[nm])return'u:'+nm+':'+G.customFlags[nm].join(',');const v=FLAG_V[nm+'@'+sid]||FLAG_V[nm];if(v)return'v:'+nm+'@'+sid;const iso=SCEN[sid]&&SCEN[sid].year>=1900&&FLAG_ISO[nm];if(iso)return'i:'+iso;return'c:'+N.color;}

function drawFlagSpec(g,v,w,h){const t=v[0],c=v.slice(1);g.fillStyle=c[0];g.fillRect(0,0,w,h);
 if(t==='h'){c.forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,h*i/c.length,w,h/c.length+0.5);});}
 else if(t==='v'){c.forEach((col,i)=>{g.fillStyle=col;g.fillRect(w*i/c.length,0,w/c.length+0.5,h);});}
 else if(t==='nc'){g.fillStyle=c[1];g.fillRect(w*0.3,0,w*0.14,h);g.fillRect(0,h*0.42,w,h*0.16);}
 else if(t==='cr'){g.fillStyle=c[1];g.fillRect(w*0.43,0,w*0.14,h);g.fillRect(0,h*0.4,w,h*0.2);}
 else if(t==='x'){g.strokeStyle=c[1];g.lineWidth=h*0.18;g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.moveTo(w,0);g.lineTo(0,h);g.stroke();}
 else if(t==='d'){g.fillStyle=c[1];g.beginPath();g.arc(w/2,h/2,h*0.3,0,7);g.fill();}
 else if(t==='em'){g.fillStyle=c[1];g.beginPath();g.arc(w/2,h/2,h*0.26,0,7);g.fill();g.strokeStyle=c[1];g.lineWidth=h*0.07;g.strokeRect(h*0.08,h*0.08,w-h*0.16,h-h*0.16);}
 else if(t==='em3'){[c[0],c[1],c[2]].forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,h*i/3,w,h/3+0.5);});g.fillStyle='#f2c230';g.beginPath();g.arc(w/2,h/2,h*0.2,0,7);g.fill();}
 else if(t==='st'){g.fillStyle=c[1];const x=w*0.16,y=h*0.22,r=h*0.11;g.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*0.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.fill();}
 else if(t==='cs'){g.fillStyle=c[1];g.beginPath();g.arc(w*0.42,h/2,h*0.26,0,7);g.fill();g.fillStyle=c[0];g.beginPath();g.arc(w*0.47,h/2,h*0.21,0,7);g.fill();g.fillStyle=c[1];g.beginPath();g.arc(w*0.62,h/2,h*0.07,0,7);g.fill();}
 else if(t==='cn'){g.fillStyle=c[1];g.fillRect(0,0,w/2,h/2);g.fillStyle=c[2];g.beginPath();g.arc(w/4,h/4,h*0.12,0,7);g.fill();}}

function flagCanvas(N){const k=flagKey(N);if(!k)return null;if(FLAGC.has(k))return FLAGC.get(k);const cv=document.createElement('canvas');cv.width=48;cv.height=32;const g=cv.getContext('2d');
 if(k[0]==='u')drawFlagSpec(g,G.customFlags[N.name],48,32);
 else if(k[0]==='v'){const nm=N.name,sid=G.sid;drawFlagSpec(g,FLAG_V[nm+'@'+sid]||FLAG_V[nm],48,32);}
 else if(k[0]==='i'){const im=loadFlagImg(k.slice(2));if(im.ok)g.drawImage(im,0,0,48,32);else{g.fillStyle=N.color;g.fillRect(0,0,48,32);}if(!im.ok){return cv;}}
 else{g.fillStyle=N.color;g.fillRect(0,0,48,32);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(0,0,48,10);}
 g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.strokeRect(0.5,0.5,47,31);FLAGC.set(k,cv);return cv;}

function drawFlagPole(N,x,y,s,now){const cv=flagCanvas(N);if(!cv)return;const w=s,h=s*0.66,px=x,py=y-s*1.1;ctx.strokeStyle='rgba(30,30,30,.9)';ctx.lineWidth=Math.max(1.2,s*0.07);ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px,py);ctx.stroke();

 (d.dy||[]).forEach(([id,nm,rgb])=>{if(!G.nations[id]&&Array.isArray(rgb)){while(G.nations.length<id){G.nations.push(null);}const N=staticNation(id,[String(nm).slice(0,20),0,0,1,0,0.5,0.5,0,1,[]],id);N.rgb=rgb.map(v=>v|0);N.color=`rgb(${N.rgb})`;N.dyn=1;const t=traitsFor(N.name,G.sid);N.traits=t.tr;N.tm=t.tm;G.nations[id]=N;growMatrices();}});
 G.yearLock=d.yl!==0;G.nuke=!!d.nk;if(d.rd){const ch=JSON.stringify(d.rd)!==JSON.stringify(G.rad||{});G.rad=d.rd;if(ch)MAPDIRTY=true;}G.conq=d.cq|0;G.conqQ=new Array(d.cqn|0).fill(0);G.conqDone=d.cqd|0;if(d.cf){G.customFlags=d.cf;}if(d.cl){G.newCities=d.nc||[];G.broads=(d.br||[]).map(b=>({n:b[0],d:b[1],p:b[2]}));ensureCities();G.cityLv=d.cl;G.cityDmg=(d.cd||[]).map(v=>v/100);if(d.ch)G.cityHp=d.ch;}G.day=d.t|0;G.spd=d.sp|0;G.pl=(d.pl&&typeof d.pl==='object')?d.pl:{};G.cheatAll=!!d.ca;const n=G.nations.length;
 for(let a=0;a<n;a++){G.war[a].fill(0);G.ally[a].fill(0);}
 (d.w||[]).forEach(([a,b,s])=>{if(a<n&&b<n){G.war[a][b]=G.war[b][a]=1;G.warStart[a][b]=G.warStart[b][a]=s|0;}});
 (d.al||[]).forEach(([a,b])=>{if(a<n&&b<n)G.ally[a][b]=G.ally[b][a]=1;});
 for(const N of G.nations)if(N)N.human=null;
 let mine=0;for(const id in G.pl){const N=G.nations[id];if(N)N.human=G.pl[id][0];if(G.pl[id][0]===NET.myPeer)mine=+id;}
 if(mine&&mine!==ME){ME=mine;UI.picking=false;MAPDIRTY=true;enterGame(true);}
 else if(!mine&&NET.gotFull&&MENU.step==='wait'){MENU.step='pick';UI.picking=true;UI.pickId=null;$('#menu').style.display='flex';renderMenu();}
 if(MENU.step==='pick'&&!mine)renderMenu();
}
function cliN2(rows){for(const r of rows){const N=G.nations[r[0]];if(!N||N.id===ME)continue;N.alive=!!r[1];N.cells=r[2];N.pop=r[3];N.landAtk=r[4];N.landDef=r[5];N.air=r[6];N.nav=r[7];N.cap=r[8];N.infC=r[9];}}
function cliDelta(d){
 if(!G)return;G.day=d.t|0;
 if(NET.gotFull&&typeof d.c==='string'&&d.c){for(const tok of d.c.split(',')){const[a,b]=tok.split(':');const i=parseInt(a,36),o=parseInt(b,36);if(i>=0&&i<W*H&&LAND[i]&&o>=0&&o<G.nations.length){G.owner[i]=o;dirtyCell(i);}}}
 const now=performance.now();(d.fx||[]).forEach(f=>{if(f[0]==='m')G.fx.push({k:'m',a:f[1]|0,b:f[2]|0,ok:f[3],pl:f[4],t:now});else if(f[0]==='s')G.fx.push({k:'s',a:f[1]|0,b:f[2]|0,t:now});else if(f[0]==='a')G.fx.push({k:'a',c:f[1]|0,n:f[2]|0,t:now});else G.fx.push({k:['r','z','n'].includes(f[0])?f[0]:'c',c:f[1]|0,r:f[0]==='n'?(f[2]|0):0,t:now});});
 if(Array.isArray(d.fr))G.frontSample=d.fr.map(x=>x|0);
 (d.ev||[]).forEach(e=>{const ent={d:e[0]|0,t:String(e[1]).slice(0,200),ids:Array.isArray(e[2])?e[2]:[],big:!!e[3]};G.log.push(ent);if(G.log.length>120)G.log.shift();if(ent.ids.includes(ME)||ent.big)feed(ent.t);});
}
function cliPriv(d){
 if(!G||d.to!==NET.myPeer||!ME)return;const N=G.nations[ME];
 if(d.pb&&typeof d.pb.s==='string'){const B=NET.pbBuf=(NET.pbBuf&&NET.pbBuf.k===d.pb.k)?NET.pbBuf:{k:d.pb.k,p:{}};B.p[d.pb.i]=d.pb.s;
  if(Object.keys(B.p).length===d.pb.n){let str='';for(let x=0;x<d.pb.n;x++)str+=B.p[x];G.bc=new Map();
   for(const tok of str.split(';')){if(!tok)continue;const[a,b]=tok.split('=');const o={};(b||'').replace(/([a-z])(\d+)/g,(_,c,n)=>{if(BFROM[c])o[BFROM[c]]=+n;});G.bc.set(parseInt(a,36),o);}}return;}
 const s=d.s;if(!s)return;
 Object.assign(N,{money:s.m,food:s.f,iron:s.i,oil:s.o,pop:s.p,popCap:s.pc,mp:s.mp,mpMax:s.mx,tax:s.tx,stab:s.st,weary:s.wy,res:s.rs||null,cap:s.cap,colonize:!!s.cl,focus:s.fo||{},dev:s.dv,hungry:!!s.fl[0],broke:!!s.fl[1],oilShort:!!s.fl[2]});
 N.units=s.u;N.queue=s.q.map(q=>({k:q[0],n:q[1],left:q[2],tot:q[3]}));BLD_IDS.forEach((b,i)=>N.bld[b]=s.b[i]);N.techs={};TECH_IDS.forEach((t,i)=>{if(s.tc[i]==='1')N.techs[t]=1;});N.rp={};if(N.res)N.rp[N.res]=s.rp;
 const R=s.rt;N.rate={money:R[0],food:R[1],iron:R[2],oil:R[3],res:R[4],tax:R[5],fac:R[6],port:R[7],gold:R[8],up:R[9]};
 [N.cells,N.farmC,N.ironC,N.oilC,N.goldC,N.coast]=s.cn;
 String(s.rl).split(',').forEach((v,i)=>{G.rel[ME][i+1]=+v;});String(s.tr).split(',').forEach((v,i)=>{G.truce[ME][i+1]=G.day+(+v);});
 G.offers=(s.of||[]).map(o=>({id:o[0],from:o[1],to:ME,type:o[2],day:G.day}));N.auto=s.au||{};N.gain=s.gn||{};N._nbr=new Set(s.nb||[]);N.qd=s.qd|0;N.foodCap=s.ft||0;N.adm=s.ad||0;N.up=s.up||{};N.allUnits=s.ul?1:0;N.reign=s.rg;N.occ=s.oc||0;N.pol=s.po|0;N.satCd=s.sc|0;N.rate.foodBuy=s.fb||0;N.famLoss=s.fl2||0;{const was=N.dmgFac||0;N.dmgFac=s.df|0;if(N.dmgFac>was)askRepair();}N.emb=Array.isArray(s.em)&&s.em.length===UNITS.length?s.em:new Array(UNITS.length).fill(0);
 calcMil(N);
 if(Array.isArray(d.m))d.m.forEach(m=>toast(String(m).slice(0,120)));
 if(typeof d.a==='number'){const before=NET.cmds.length;NET.cmds=NET.cmds.filter(c=>c[0]>d.a);if(NET.cmds.length!==before)NET.nr.presence({cmds:NET.cmds}).catch(()=>{});}
 if(!N.alive&&!G.lostShown){G.lostShown=true;showModal(`<h2>😢 우리나라가 사라졌어요</h2><button class="btn big" onclick="hideModal();toMenu()">처음으로</button>`);}
}
function cliFull(d){
 if(!G||typeof d.s!=='string')return;const b=NET.buf[d.k]=NET.buf[d.k]||{n:d.n,p:{}};b.p[d.i]=d.s;
 if(Object.keys(b.p).length===b.n){let s='';for(let i=0;i<b.n;i++)s+=b.p[i];NET.buf={};unrleLand(s);
  for(const N of G.nations)if(N){N.cells=0;}for(const i of LANDS){const o=G.owner[i];if(o>0&&G.nations[o])G.nations[o].cells+=1/CF;}
  MAPDIRTY=true;

}

 const dt=Math.min(0.25,(now-lastT)/1000);lastT=now;
 if(G&&NET.mode!=='client'&&!UI.picking&&!UI.tut&&ME){acc+=dt*SPEEDS[G.spd];let k=0;while(acc>=1&&k<12){simDay();acc-=1;k++;}if(acc>15)acc=0;}
