<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>세계 정복 대작전</title>
<style>
:root{--panel:#fffaf0;--ink:#3a2e1f;--line:#f0dfbf;--accent:#ff8a3d;--good:#22a861;--bad:#e8484e;--blue:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:#5bb4ec;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));display:none;gap:5px;align-items:center;background:rgba(255,250,240,.94);box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:13px;flex:none}
.chip small{font-weight:700;font-size:11px}
.pos{color:var(--good)}.neg{color:var(--bad)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:none;background:#fffaf0;border-top:2px solid var(--line);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:6px 0 7px;font-size:21px;line-height:1.1}
#tabs button span{display:block;font-size:11px;font-weight:800;color:#8a7553}
#tabs button.on{background:#ffe6c7;border-radius:12px}
#panel{position:fixed;left:0;right:0;bottom:58px;max-height:54vh;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.22);z-index:6;padding:12px 12px 18px;display:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet{position:fixed;left:8px;right:8px;bottom:66px;background:#fff;border-radius:18px;box-shadow:0 6px 22px rgba(0,0,0,.28);z-index:8;padding:12px;display:none;border:3px solid var(--line);max-height:60vh;overflow-y:auto}
@media(min-width:900px){
 #panel{left:auto;right:12px;top:64px;bottom:76px;width:420px;max-height:none;border-radius:20px}
 #tabs{left:auto;right:12px;width:420px;bottom:8px;border-radius:18px;border:2px solid var(--line)}
 #sheet{left:12px;right:auto;width:380px;bottom:16px}
}
h3{margin:4px 0 8px;font-size:18px}
h4{margin:14px 0 6px;font-size:15px;color:#7a5a2a}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 10px;margin:7px 0}
.card.lock{opacity:.55;background:#f6f1e6}
.card .t{font-weight:800;font-size:15px}
.card .s{font-size:12px;color:#7d6b52;margin-top:2px;line-height:1.45}
.btn{border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;background:var(--accent);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--good)}.btn.b{background:var(--blue)}.btn.r{background:var(--bad)}.btn.w{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:6px 9px;font-size:13px}
.btn:disabled{background:#d8cdb9;color:#fff;box-shadow:none}
.bar{height:10px;background:#f1e5cf;border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff7a3d);border-radius:99px}
.bar.g i{background:linear-gradient(90deg,#7ee08a,#22a861)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.2);vertical-align:-2px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:#ffe6c7;color:#a45a12;margin-left:4px}
.tag.inf{background:#d9f5e1;color:#15804a}.tag.war{background:#ffe0e0;color:#c42e33}.tag.ally{background:#dde9ff;color:#2a5fc4}
.muted{color:#8f7c5f;font-size:12px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
#toast div{background:rgba(58,46,31,.92);color:#fff;padding:9px 14px;border-radius:14px;font-weight:700;font-size:14px;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#feed{position:fixed;left:8px;bottom:66px;z-index:4;max-width:62%;pointer-events:none;display:none}
#feed div{background:rgba(255,250,240,.88);border-radius:10px;padding:4px 8px;margin-top:4px;font-size:12px;font-weight:700}
.screen{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#7fd0ff,#ffd59e);overflow-y:auto;display:flex;justify-content:center;padding:20px 14px 40px}
.screen .box{width:100%;max-width:520px}
.title{font-size:34px;font-weight:900;text-align:center;margin:18px 0 4px;color:#fff;text-shadow:0 3px 0 #e07b28,0 6px 14px rgba(0,0,0,.2)}
.sub{text-align:center;color:#6b4c1f;font-weight:700;margin-bottom:18px}
.big{display:block;width:100%;margin:10px 0;padding:16px;font-size:18px;border-radius:18px}
.scen{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}
.scen.on{border-color:var(--accent);background:#fff4e6}
.scen b{font-size:18px}
input[type=text],input[type=number],input[type=password]{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);width:100%;background:#fff}
input[type=range]{width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fffaf0;border-radius:22px;padding:18px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.nlist{max-height:30vh;overflow-y:auto}
.aimbar{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9;background:#e8484e;color:#fff;font-weight:800;padding:9px 14px;border-radius:14px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="top"></div>
<div id="feed"></div>
<div id="panel"></div>
<div id="sheet"></div>
<div id="aimbar" class="aimbar"></div>
<div id="tabs">
 <button data-tab="home">🏠<span>우리나라</span></button>
 <button data-tab="army">🪖<span>군대</span></button>
 <button data-tab="tech">🔬<span>연구</span></button>
 <button data-tab="build">🏗️<span>건설</span></button>
 <button data-tab="diplo">🌍<span>외교</span></button>
 <button data-tab="menu">⚙️<span>메뉴</span></button>
</div>
<div id="toast"></div>
<div id="menu" class="screen"><div class="box" id="menubox"></div></div>
<div id="modal" class="modal" style="display:none"><div class="box" id="modalbox"></div></div>

function hsl2rgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];}
function staticNation(id,r,idx){
 const h=(idx*137.508+20)%360,s=55+(idx%3)*8,l=60+(idx%4)*4,rgb=hsl2rgb(h,s,l);
 return{id,name:r[0],lon:r[1],lat:r[2],r:r[3],pop0:r[4],dev:r[5],aggr:r[6],tier:r[7],arm:r[8],seeds:r[9]||[],rgb,color:`rgb(${rgb})`,
  alive:true,cap:-1,pop:r[4],dens:0,cells:0,farmC:0,ironC:0,oilC:0,goldC:0,coast:0,
  auto:{res:0,army:0,build:0},gain:{},money:0,food:0,iron:0,oil:0,mp:0,mpMax:0,tax:0.25,stab:70,weary:0,techs:{},res:null,rp:{},
  units:new Array(UNITS.length).fill(0),queue:[],bld:Object.fromEntries(BLD_IDS.map(b=>[b,0])),focus:{},colonize:true,human:null,rate:{money:0,food:0,iron:0,oil:0,res:0,tax:0,fac:0,port:0,gold:0,up:0},
  infC:0,landAtk:0,landDef:0,air:0,bomb:0,nav:0,mis:0,oilUse:0,popCap:0,block:0,_nbr:new Set(),_neutral:[],_front:0};
}
function newG(sid,diff){
 const S=SCEN[sid];
 G={sid,diff,day:0,spd:1,owner:new Uint8Array(W*H),nations:[null],log:[],offers:[],fx:[],frontSample:[],K:1,cheatAll:false,won:false};
 for(let i=0;i<W*H;i++)G.owner[i]=LAND[i]?0:SEA;
 S.list.forEach((r,idx)=>G.nations.push(staticNation(idx+1,r,idx)));
 const n=G.nations.length;G.war=[];G.ally=[];G.rel=[];G.truce=[];G.warStart=[];
 for(let a=0;a<n;a++){G.war.push(new Uint8Array(n));G.ally.push(new Uint8Array(n));G.rel.push(new Int8Array(n));G.truce.push(new Int32Array(n));G.warStart.push(new Int32Array(n));}
 return G;
}

class Heap{constructor(){this.a=[];}get size(){return this.a.length;}
 push(k,v){const a=this.a;a.push([k,v]);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p;}}
 pop(){const a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<a.length&&a[l][0]<a[m][0])m=l;if(r<a.length&&a[r][0]<a[m][0])m=r;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m;}}return top;}}
function snapLand(lon,lat){const c=cellAt(lon,lat);if(c<0)return -1;if(LAND[c])return c;let best=-1,bd=1e9;const cx=c%W,cy=(c/W)|0;
 for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const y=cy+dy;if(y<0||y>=H)continue;const x=((cx+dx)%W+W)%W,j=y*W+x;if(LAND[j]){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=j;}}}return best;}

function addCell(N,i,s){N.cells+=s;N.dens+=DENS[i]*s;const f=RES[i];if(f&1)N.farmC+=s;if(f&2)N.ironC+=s;if(f&4)N.oilC+=s;if(f&8)N.goldC+=s;if(COAST[i])N.coast+=s;}
function eraMul(N){const T=N.techs;return(T.industry?2:1)*(T.electronics?1.4:1)*(T.computer?1.5:1)*(T.ai?1.3:1);}
function resMul(N){const T=N.techs;return(T.printing?1.25:1)*(T.electronics?1.3:1)*(T.computer?1.5:1)*(T.ai?1.6:1);}
function capMul(N){const T=N.techs;return 1.3*(T.agri?1.15:1)*(T.industry?1.4:1)*(T.medicine?1.4:1)*(T.computer?1.2:1)*(1+N.bld.town*0.03);}
function bldCap(N,b){switch(b){case'farm':return Math.floor(N.farmC*0.6)+2;case'mine':return N.ironC+1;case'well':return N.oilC;case'factory':return 2+Math.floor(N.cells/3);
 case'lab':return 3+Math.floor(Math.sqrt(N.cells))+Math.floor(Math.sqrt(N.pop)/3);case'barracks':return 10;case'port':return N.coast?1+Math.floor(N.coast/3):0;case'town':return 2+Math.floor(N.cells/2);case'airdef':return 12;}return 0;}
function bldCost(N,b){return Math.round(BLD[b].cost*eraMul(N)*(1+0.12*N.bld[b]));}
function bldTotal(N){let s=0;for(const b of BLD_IDS)s+=N.bld[b];return s;}
const kid=N=>!!(N&&N.human&&G.diff===0);
function unlocked(N,k){const u=UNITS[k];return !u.t||!!N.techs[u.t];}
function trainDays(N,k){const u=UNITS[k];return (u.c==='land'?u.days/(1+N.bld.barracks*0.1):u.days/Math.min(2.5,1+N.bld.factory*0.03))/(kid(N)?2:1);}

function setupNation(N,S){
 if(N.cells<=0){N.alive=false;return;}
 (S.tiers[N.tier]||[]).forEach(t=>N.techs[t]=1);
 const em=eraMul(N);
 N.pop=N.pop0;N.popCap=N.dens*G.K*capMul(N);
 N.bld.farm=Math.round(N.farmC*0.3);N.bld.mine=Math.round(N.ironC*0.3);N.bld.well=N.techs.engine?Math.round(N.oilC*0.3):0;
 N.bld.factory=Math.round(bldCap(N,'factory')*Math.min(1,N.dev*0.5));N.bld.lab=Math.round(bldCap(N,'lab')*N.dev*0.3);
 N.bld.barracks=Math.round(2*N.dev);N.bld.port=Math.round(bldCap(N,'port')*0.5*N.dev);N.bld.town=Math.round(bldCap(N,'town')*0.3);N.bld.airdef=N.techs.shield?3:0;
 N.money=250*em*N.dev+N.pop*2;N.food=50+N.pop*1.5;N.iron=150;N.oil=N.techs.engine?120:0;
 N.mpMax=N.pop*50;N.mp=N.mpMax;N.tax=0.25;N.stab=72;
 const base=Math.sqrt(N.pop)*2.5*N.arm*(0.6+N.aggr*0.6);
 const give=(cls,cnt)=>{const k=bestUnits(N,cls)[0];if(k!=null&&cnt>0){N.units[k]+=Math.round(cnt);N.mp-=UNITS[k].mp*Math.round(cnt);}};
 give('inf',Math.max(3,base));give('sup',base*0.5);
 if(N.techs.flight)give('air',base*0.3);if(N.coast)give('sea',base*0.25);if(N.techs.guided)give('mis',base*0.1);
 if(N.mp<0)N.mp=0;
 N.res=null;calcMil(N);
}
function bestUnits(N,cls){
 const list=[];UNITS.forEach((u,k)=>{if(!unlocked(N,k))return;
  if(cls==='inf'&&u.c==='land'&&u.inf)list.push(k);else if(cls==='sup'&&u.c==='land'&&!u.inf)list.push(k);else if(cls===u.c)list.push(k);});
 list.sort((x,y)=>{const a=UNITS[x],b=UNITS[y];return(b.a+(b.d||0)+(b.b||0))-(a.a+(a.d||0)+(a.b||0));});return list;
}

function initGame(sid,diff){
 newG(sid,diff);const S=SCEN[sid];
 const h=new Heap();
 G.nations.forEach(N=>{if(!N)return;[[N.lon,N.lat,N.r]].concat(N.seeds).forEach((s,k)=>{const c=snapLand(s[0],s[1]);if(c<0)return;if(k===0)N.cap=c;h.push(0,[c,N.id,0,Math.max(1,s[2]/CS)]);});});
 const claimed=new Uint8Array(W*H);
 while(h.size){const[,v]=h.pop();const[c,id,st,rc]=v;if(claimed[c])continue;claimed[c]=1;G.owner[c]=id;for(const j of NB[c]){if(claimed[j])continue;const s2=st+1;if(s2>rc)continue;h.push(s2/rc,[j,id,s2,rc]);}}
 G.nations.forEach(N=>{if(N&&N.cap>=0)G.owner[N.cap]=N.id;});
 for(const i of LANDS){const o=G.owner[i];if(o>0)addCell(G.nations[o],i,1);}
 let tp=0,td=0;G.nations.forEach(N=>{if(N&&N.cells>0){tp+=N.pop0;td+=N.dens;}});G.K=tp/Math.max(td,1e-6);
 G.nations.forEach(N=>{if(!N)return;if(N.cap<0||G.owner[N.cap]!==N.id)N.cap=LANDS.find(i=>G.owner[i]===N.id)??-1;setupNation(N,S);});
 const n=G.nations.length;
 for(let a=1;a<n;a++)for(let b=a+1;b<n;b++){const v=Math.round(rnd()*50-15);G.rel[a][b]=G.rel[b][a]=v;}
 scanBorders();
}

/* ---------------- 땅 주인 바꾸기 ---------------- */
function setOwner(i,o){
 const old=G.owner[i];if(old===o||old===SEA)return;
 const A=old>0?G.nations[old]:null,B=o>0?G.nations[o]:null;
 if(A){const share=A.pop*DENS[i]/Math.max(A.dens,1e-6);A.pop=Math.max(0.01,A.pop-share);addCell(A,i,-1);if(B)B.pop+=share*0.95;}
 else if(B)B.pop+=DENS[i]*G.K*0.3;
 if(B)addCell(B,i,1);
 if(A&&B&&G.war[A.id][B.id]){B.gain[A.id]=(B.gain[A.id]||0)+1;A.gain[B.id]=(A.gain[B.id]||0)-1;}
 G.owner[i]=o;MAPDIRTY=true;
 if(NET.mode==='host')NET.chg.set(i,o);
 if(A){if(A.cells<=0)eliminate(A,B);else if(i===A.cap)capitalLost(A,B);}
}
function capitalLost(A,B){
 let best=-1,bd=-1;const cx=A.cap%W,cy=(A.cap/W)|0;
 for(const j of LANDS){if(G.owner[j]!==A.id)continue;const dx=Math.min(Math.abs(j%W-cx),W-Math.abs(j%W-cx)),dy=((j/W)|0)-cy;const sc=DENS[j]*3-Math.sqrt(dx*dx+dy*dy)*0.1;if(sc>bd){bd=sc;best=j;}}
 A.cap=best;A.stab=Math.max(0,A.stab-15);A.weary+=15;
 log(`🏰 ${A.name}의 수도를 ${B?B.name:'누군가'}이(가) 차지했어요! 수도를 옮겼어요.`,[A.id,B&&B.id]);
}
function eliminate(A,B){
 if(!A.alive)return;A.alive=false;A.units.fill(0);A.queue=[];A.human=A.human;
 for(let j=1;j<G.nations.length;j++){G.war[A.id][j]=G.war[j][A.id]=0;G.ally[A.id][j]=G.ally[j][A.id]=0;}
 G.offers=G.offers.filter(o=>o.from!==A.id&&o.to!==A.id);
 log(`🏳️ ${A.name}이(가) ${B?B.name+'에 합쳐졌어요':'사라졌어요'}.`,[A.id,B&&B.id],true);
}

/* ---------------- 기록 ---------------- */
function log(t,ids,big){const e={d:G.day,t,ids:(ids||[]).filter(Boolean),big:!!big};G.log.push(e);if(G.log.length>120)G.log.shift();
 if(NET.mode==='host')NET.evq.push([e.d,e.t,e.ids,e.big?1:0]);
 if(e.ids.includes(ME)||e.big)feed(t);}

/* ---------------- 군사력 계산 ---------------- */
function calcMil(N){
 let infC=0,infA=0,infD=0,supC=0,supA=0,supD=0,air=0,bomb=0,nav=0,mis=0,oilUse=0;const oF=N.oilShort?0.4:1;
 for(let k=0;k<UNITS.length;k++){const c=N.units[k];if(!c)continue;const u=UNITS[k],f=u.oil?oF:1;
  if(u.c==='land'){if(u.inf){infC+=c;infA+=c*u.a*f;infD+=c*u.d*f;}else{supC+=c;supA+=c*u.a*f;supD+=c*u.d*f;}}
  else if(u.c==='air'){air+=c*u.a*f;bomb+=c*u.b*f;}else if(u.c==='sea'){nav+=c*u.a*f;if(u.b)air+=c*u.b*f;}else mis+=c;
  oilUse+=c*(u.oil||0);}
 const k=supC>0?Math.min(1,infC*1.5/supC):1,gen=(N.hungry?0.7:1)*(0.7+N.stab/333);
 N.infC=infC;N.supC=supC;N.supK=k;N.landAtk=(infA+supA*k)*gen;N.landDef=(infD+supD*k)*gen;N.air=air*gen;N.bomb=bomb*gen;N.nav=nav*gen;N.mis=mis;N.oilUse=oilUse;
}
function applyLoss(N,cat,frac){if(frac<=0)return;frac=Math.min(frac,0.2);for(let k=0;k<UNITS.length;k++){if(UNITS[k].c===cat&&N.units[k]>0){N.units[k]*=1-frac;if(N.units[k]<0.05)N.units[k]=0;}}}

/* ---------------- 하루 경제 ---------------- */
function econDay(N){
 const T=N.techs,em=eraMul(N),stF=0.5+N.stab/200,d=N.dev,r=N.rate;
 if(!warCount(N))N.peakCells=N.cells;
 let land=0;for(let k=0;k<UNITS.length;k++)if(UNITS[k].c==='land')land+=N.units[k];
 const fp=(N.farmC*0.25+N.bld.farm*4)*(T.agri?1.3:1)*(T.industry?1.5:1),fu=N.pop*0.15+land*0.02;
 r.food=fp-fu;N.food+=r.food;N.hungry=N.food<0;N.food=clamp(N.food,0,100+N.pop*3);
 const cap=N.dens*G.K*capMul(N);N.popCap=cap;
 if(N.hungry)N.pop*=1-0.0006;else if(N.pop<cap){const g=0.012*(T.agri?1.2:1)*(T.medicine?1.4:1)*stF;N.pop+=N.pop*g/365*(1-N.pop/cap)*3;}else N.pop-=(N.pop-cap)*0.001;
 N.mpMax=N.pop*50;N.mp=Math.min(N.mpMax,N.mp+(N.mpMax-N.mp)*0.006+0.01);
 r.iron=N.ironC*0.3+N.bld.mine*3;N.iron=Math.min(N.iron+r.iron,500+N.bld.mine*100);
 r.oil=(T.engine?N.oilC*0.3+N.bld.port*1.5:0)+N.bld.well*4-N.oilUse;N.oil+=r.oil;N.oilShort=N.oil<0;N.oil=clamp(N.oil,0,500+N.bld.well*150);
 r.tax=N.pop*0.6*N.tax*d*em*stF;r.fac=N.bld.factory*2*em*d*stF;r.port=N.bld.port*1.5*em*d*(1-(N.block||0))*stF;r.gold=N.goldC*0.5*em*stF;
 let up=0;for(let k=0;k<UNITS.length;k++)up+=N.units[k]*UNITS[k].cost*0.002;
 r.up=up+bldTotal(N)*0.03*em;r.money=r.tax+r.fac+r.port+r.gold-r.up;
 N.money+=r.money;N.broke=false;
 if(N.money<0){N.money=0;if(r.money<0){N.broke=true;applyLoss(N,'land',0.003);applyLoss(N,'air',0.003);applyLoss(N,'sea',0.003);}}
 const tgt=78-Math.max(0,N.tax-0.2)*200-N.weary*0.4-(N.hungry?25:0)-(N.broke?15:0)-Math.max(0,N.cells-400)/40;N.stab+=(clamp(tgt,0,100)-N.stab)*0.02;
 r.res=(1+Math.sqrt(N.pop)*0.6+N.bld.lab*2*Math.max(0.5,d))*resMul(N)*stF*(kid(N)?2:1);
 if(N.res&&TECH[N.res]){N.rp[N.res]=(N.rp[N.res]||0)+r.res;if(N.rp[N.res]>=TECH[N.res].cost)finishTech(N,N.res);}
 const wc=warCount(N);N.weary=wc?Math.min(100,N.weary+0.04*wc):Math.max(0,N.weary-0.08);
 // 훈련
 const kb=kid(N)?2:1,fl=(1+N.bld.barracks*0.1)*kb,fo=Math.min(2.5,1+N.bld.factory*0.03)*kb;
 for(const q of N.queue)q.left-=UNITS[q.k].c==='land'?fl:fo;
 N.queue=N.queue.filter(q=>{if(q.left<=0){N.units[q.k]+=q.n;if(N.id===ME)feed(`✅ ${UNITS[q.k].e} ${UNITS[q.k].n} ${q.n}부대 훈련 완료!`);return false;}return true;});
}
function finishTech(N,t){N.techs[t]=1;N.res=null;delete N.rp[t];
 if(N.human)log(`🎉 ${N.name}: 새 기술 「${TECH[t].e} ${TECH[t].n}」 개발 완료!`,[N.id]);
 if(N.human===null&&NET.mode!=='client'&&['flight','computer','ai','swarm','robotics','hypersonic'].includes(t))log(`🔬 ${N.name}이(가) ${TECH[t].e} ${TECH[t].n} 기술을 개발했어요`,[N.id],true);}
function availTechs(N){return TECH_IDS.filter(t=>!N.techs[t]&&TECH[t].req.every(q=>N.techs[q]));}
function warCount(N){let c=0;const w=G.war[N.id];for(let j=1;j<w.length;j++)if(w[j])c++;return c;}

/* ---------------- 국경/전쟁 ---------------- */
function scanBorders(){
 for(const N of G.nations)if(N){N._front=0;N._neutral=[];N._nbr=new Set();N.block=0;}
 G.fronts=new Map();G.frontSample=[];
 for(const i of LANDS){const o=G.owner[i];if(!o)continue;const N=G.nations[o];let fr=false;
  for(const j of NB[i]){const p=G.owner[j];if(p===o)continue;if(p===0){N._neutral.push(j);continue;}N._nbr.add(p);
   if(G.war[o][p]){fr=true;const key=o*256+p;let a=G.fronts.get(key);if(!a){a=[];G.fronts.set(key,a);}a.push(j);}}
  if(fr){N._front++;if(rnd()<0.04&&G.frontSample.length<24)G.frontSample.push(i);}}
}
function cellDist(a,b){const ax=a%W,bx=b%W;let dx=Math.abs(ax-bx);dx=Math.min(dx,W-dx);const dy=((a/W)|0)-((b/W)|0);return Math.sqrt(dx*dx+dy*dy);}
function warDay(){
 for(const[key,targets]of G.fronts){
  const a=key>>8,b=key&255,A=G.nations[a],B=G.nations[b];if(!A.alive||!B.alive)continue;
  const sA=A.air+B.air>0?A.air/(A.air+B.air):0.5;
  const dA=A.landAtk*(0.7+0.6*sA)*(kid(A)?1.6:1)/Math.max(1,A._front),dB=B.landDef*(0.7+0.6*(1-sA))*1.15*(kid(B)?1.4:1)/Math.max(1,B._front);
  const r=(dA+0.01)/(dB+0.01);
  A.lossL=(A.lossL||0)+0.0025*clamp(1/r,0.2,3);B.lossL=(B.lossL||0)+0.0025*clamp(r,0.2,3);
  if(A.infC<0.5)continue; // 기본 병사가 없으면 땅을 차지할 수 없어요
  let p=Math.max(0,0.05*r*r/(1+r*r)-0.018);if(kid(B))p*=0.4;if(p<=0)continue;
  const f=A.focus[b];let maxCap=Math.max(1,Math.ceil(targets.length*0.03));
  for(const t of targets){if(maxCap<=0)break;if(G.owner[t]!==b)continue;let q=p;if(f!=null&&f>=0){q*=cellDist(t,f)<9?1.8:0.6;}
   if(rnd()<q){setOwner(t,a);maxCap--;if(rnd()<0.3)addFx({k:'c',c:t});}}
 }
 // 해군·공군 (짝마다 한 번)
 const n=G.nations.length;
 for(let a=1;a<n;a++){const A=G.nations[a];if(!A.alive)continue;for(let b=a+1;b<n;b++){if(!G.war[a][b])continue;const B=G.nations[b];if(!B.alive)continue;seaAir(A,B);seaAir(B,A,true);}}
 for(const N of G.nations){if(!N||!N.alive)continue;if(N.lossL){applyLoss(N,'land',Math.min(0.02,N.lossL));N.weary=Math.min(100,N.weary+N.lossL*3);N.lossL=0;}
  for(const id in N.focus){const fid=+id;if(!G.war[N.id][fid]){delete N.focus[id];continue;}if(G.owner[N.focus[id]]!==fid&&!N.human){const M=G.nations[fid];N.focus[id]=M.cap;}}}
}
function seaAir(A,B,second){
 // 해전
 if(A.nav+B.nav>0){if(!second){const t=A.nav+B.nav;applyLoss(A,'sea',0.004*B.nav/t);applyLoss(B,'sea',0.004*A.nav/t);}
  if(A.nav>B.nav)B.block=Math.max(B.block,A.nav/(A.nav+B.nav)*0.8);
  // 바다 건너 상륙
  const kA=kid(A);if(A.nav>B.nav*(kA?1:1.5)&&A.infC>=(kA?1:3)&&A.coast>0&&rnd()<(kA?0.2:0.05)*A.nav/(A.nav+B.nav+1e-9)){
   for(let k=0;k<40;k++){const c=COASTS[Math.floor(rnd()*COASTS.length)];if(G.owner[c]===B.id){if(A.landAtk*(kA?1:0.3)>B.landDef*(0.5+rnd())){setOwner(c,A.id);addFx({k:'c',c});}break;}}}}
 // 공중전·폭격
 if(A.air+B.air>0){const t=A.air+B.air+1;if(!second){applyLoss(A,'air',0.003*B.air/t);applyLoss(B,'air',0.003*A.air/t);}
  const s=A.air/t;if(A.bomb>0){applyLoss(B,'land',0.002*s*Math.min(1,A.bomb/(B.landDef+1)));if(B.bld.factory>0&&rnd()<s*A.bomb/(B.landDef*20+3000))B.bld.factory--;}}
}
function colonizeDay(){
 for(const N of G.nations){if(!N||!N.alive||!N.colonize||!N._neutral.length||N.infC<1)continue;
  const p=0.25+0.5*Math.min(1,N.infC/30),cost=2*eraMul(N);if(rnd()<p&&N.money>=cost){N.money-=cost;setOwner(pick(N._neutral),N.id);}}
}
function declareWar(a,b){
 if(a===b||G.war[a][b])return;const A=G.nations[a],B=G.nations[b];
 G.war[a][b]=G.war[b][a]=1;G.warStart[a][b]=G.warStart[b][a]=G.day;G.rel[a][b]=G.rel[b][a]=-100;G.ally[a][b]=G.ally[b][a]=0;A.gain[b]=0;B.gain[a]=0;
 if(A.id===ME)feed('⚔️ 전쟁 시작! 국경에서 저절로 싸워요. 적 땅을 눌러 🎯 공격할 곳을 고를 수 있어요.');
 if(!A.human)A.focus[b]=B.cap;if(!B.human)B.focus[a]=A.cap;
 log(`⚔️ ${A.name}이(가) ${B.name}에게 전쟁을 선포했어요!`,[a,b],true);
 for(let c=1;c<G.nations.length;c++){if(c===a||c===b||!G.ally[b][c]||G.war[c][a]||G.ally[c][a])continue;const C=G.nations[c];if(!C.alive)continue;
  G.war[c][a]=G.war[a][c]=1;G.warStart[c][a]=G.warStart[a][c]=G.day;G.rel[c][a]=G.rel[a][c]=-100;if(!C.human)C.focus[a]=A.cap;
  log(`🤝 ${C.name}이(가) 친구 ${B.name}을(를) 도우러 왔어요!`,[c,a,b],true);}
}
function makePeace(a,b){if(!G.war[a][b])return;G.war[a][b]=G.war[b][a]=0;G.truce[a][b]=G.truce[b][a]=G.day+365;G.rel[a][b]=G.rel[b][a]=-20;
 delete G.nations[a].focus[b];delete G.nations[b].focus[a];
 G.offers=G.offers.filter(o=>!((o.from===a&&o.to===b)||(o.from===b&&o.to===a)));
 log(`🕊️ ${G.nations[a].name}와(과) ${G.nations[b].name}이(가) 평화 조약을 맺었어요.`,[a,b],true);}
function makeAlly(a,b){G.ally[a][b]=G.ally[b][a]=1;G.rel[a][b]=G.rel[b][a]=Math.max(G.rel[a][b],60);log(`🤝 ${G.nations[a].name}와(과) ${G.nations[b].name}이(가) 동맹을 맺었어요!`,[a,b],true);}
let OFFER_ID=1;
function offer(from,to,type){if(G.offers.some(o=>o.from===from&&o.to===to&&o.type===type))return;G.offers.push({id:OFFER_ID++,from,to,type,day:G.day});
 const N=G.nations[to];if(to===ME)feed(`📨 ${G.nations[from].name}이(가) ${type==='peace'?'평화':'동맹'}을 제안했어요! (외교 탭)`);}

/* ---------------- 미사일 ---------------- */
function fireMissile(A,k,cell){
 const u=UNITS[k];if(!u||u.c!=='mis')return'미사일이 아니에요';if(A.units[k]<1)return'그 미사일이 없어요';
 const b=G.owner[cell];if(!(b>0&&b!==SEA))return'나라 땅을 골라 주세요';if(!G.war[A.id][b])return'전쟁 중인 나라에만 쏠 수 있어요';
 const B=G.nations[b];A.units[k]-=1;
 const block=Math.min(0.75,B.bld.airdef*0.07+(B.techs.shield?0.15:0));const ok=rnd()>block;
 addFx({k:'m',a:A.cap,b:cell,ok:ok?1:0});
 if(ok){const frac=u.a/(u.a+B.landDef*0.5+50)*0.25;applyLoss(B,'land',frac);applyLoss(B,'air',frac*0.5);
  const kill=Math.floor(u.a/300)+(rnd()<0.5?1:0);B.bld.factory=Math.max(0,B.bld.factory-kill);B.stab=Math.max(0,B.stab-2);
  if(A.human||B.human)log(`🚀 ${A.name}의 ${u.n}이(가) ${B.name}의 기지에 명중했어요! (군대 -${Math.round(frac*100)}%)`,[A.id,b]);
  return null;}
 if(A.human||B.human)log(`🛡️ ${B.name}이(가) ${A.name}의 ${u.n}을(를) 막아냈어요!`,[A.id,b]);return null;
}
function addFx(f){f.t=performance.now();G.fx.push(f);if(G.fx.length>60)G.fx.shift();if(NET.mode==='host'&&NET.fxq.length<12)NET.fxq.push(f);}

/* ---------------- AI ---------------- */
function autoHelper(N){
 const a=N.auto||{};if(a.res)aiResearch(N);
 let budget=N.money-(N.rate.up*20+20);if(budget<=0)return;
 if(a.build){const half=budget*0.5;budget=budget-half+aiBuild(N,half);}
 if(a.army&&budget>0)aiArmy(N,budget,warCount(N)?0.6:0.45);

function aiDay(){

  if((G.day+N.id)%5===0)aiEcon(N);

  if((G.day+N.id)%15===0)aiPeace(N);
  if(N.mis>=1&&(G.day+N.id)%20===0&&warCount(N)){const en=[];for(let j=1;j<G.nations.length;j++)if(G.war[N.id][j])en.push(j);const E=G.nations[pick(en)];
   const k=bestUnits(N,'mis').find(k=>N.units[k]>=1);if(k!=null&&E.cap>=0)fireMissile(N,k,E.cap);}}
 if(G.day%30===0)for(let a=1;a<G.nations.length;a++)for(let b=1;b<G.nations.length;b++){if(a===b||G.war[a][b])continue;const v=G.rel[a][b];if(v>5)G.rel[a][b]--;else if(v<-5)G.rel[a][b]++;}

}
function aiResearch(N){if(!N.res){const av=availTechs(N);if(av.length){av.sort((a,b)=>TECH[a].cost*(0.7+rnd()*0.6)-TECH[b].cost*(0.7+rnd()*0.6));N.res=av[0];if(N.human&&N.id===ME)feed(`🤖 자동 연구: 「${TECH[N.res].e} ${TECH[N.res].n}」 연구를 시작했어요`);}}}
function aiEcon(N){
 aiResearch(N);
 const r=N.rate;
 if(r.money<0)N.tax=Math.min(0.4,N.tax+0.02);else if(N.tax>0.22&&N.stab<50)N.tax-=0.01;

}
function aiBuild(N,budget){const r=N.rate;
 const opts=[];if(r.food<0)opts.push('farm','farm');if(r.oil<0&&N.techs.engine)opts.push('well','port','well','port');
 opts.push('factory','factory','lab','town','mine','barracks','port','farm');if(N.techs.shield)opts.push('airdef');
 for(let t=0;t<4;t++){const b=t<opts.length&&(r.food<0||r.oil<0)?opts[t]:pick(opts);const c=bldCost(N,b);if(!canBuild(N,b)&&c<budget*0.5){doBuild(N,b);budget-=c;break;}}

function aiArmy(N,budget,lim){const r=N.rate,inc=r.tax+r.fac+r.port+r.gold;let upk=r.up;
 for(let t=0;t<4&&upk<inc*lim&&budget>0;t++){
  const k=pickUnit(N);if(k==null)break;const u=UNITS[k];const n=Math.max(1,Math.floor(Math.min(budget*0.5/u.cost,5)));
  if(canTrain(N,k,n))break;doTrain(N,k,n);budget-=u.cost*n;upk+=u.cost*n*0.002;}
}
function pickUnit(N){
 let qi=0,qs=0;for(const q of N.queue){const u=UNITS[q.k];if(u.c==='land'){if(u.inf)qi+=q.n;else qs+=q.n;}}
 const tryC=cls=>bestUnits(N,cls).find(k=>!canTrain(N,k,1));
 let k=null;if(N.infC+qi<(N.supC+qs)*0.8+3)k=tryC('inf');
 if(k==null){const x=rnd();const war=warCount(N)>0;
  if(x<0.35)k=tryC('sup');else if(x<0.55)k=tryC('air');else if(x<0.72&&N.coast>0)k=tryC('sea');else if(x<0.82&&war)k=tryC('mis');}
 if(k==null)k=tryC('inf');return k;
}
function aiWar(N){
 if(warCount(N)>=(N.aggr>0.7?2:1)||N.weary>30)return;
 let best=null,bs=0;
 for(const id of N._nbr){const M=G.nations[id];if(!M||!M.alive||G.war[N.id][id]||G.ally[N.id][id]||G.truce[N.id][id]>G.day)continue;
  let s=(N.landAtk+1)/(M.landDef+1)*(0.5+N.aggr)-G.rel[N.id][id]/50;
  if(M.human){if(G.diff===0||(G.diff===1&&G.day<365))continue;s*=[0,0.8,1.3][G.diff];}
  if(s>bs){bs=s;best=M;}}

}
function aiPeace(N){
 for(let id=1;id<G.nations.length;id++){if(!G.war[N.id][id])continue;const M=G.nations[id],dur=G.day-G.warStart[N.id][id];

}
function aiAccept(N,P,type){

function canTrain(N,k,n){const u=UNITS[k];if(!u)return'없는 부대예요';if(!unlocked(N,k))return`🔒 「${TECH[u.t].n}」 연구가 필요해요`;

 if(N.money<u.cost*n)return'💰 돈이 부족해요';if(N.iron<(u.fe||0)*n)return'⛏️ 철이 부족해요';if(N.mp<u.mp*n)return'👨‍👩‍👧 병사가 될 사람이 부족해요';return null;}
function doTrain(N,k,n){const u=UNITS[k];N.money-=u.cost*n;N.iron-=(u.fe||0)*n;N.mp-=u.mp*n;const d=Math.round(u.days);N.queue.push({k,n,left:d,tot:d});}
function canBuild(N,b){const B=BLD[b];if(!B)return'없는 건물이에요';if(B.t&&!N.techs[B.t])return`🔒 「${TECH[B.t].n}」 연구가 필요해요`;if(N.bld[b]>=bldCap(N,b))return'더 지을 자리가 없어요 (땅을 넓혀 보세요)';if(N.money<bldCost(N,b))return'💰 돈이 부족해요';return null;}
function doBuild(N,b){N.money-=bldCost(N,b);N.bld[b]++;}
const CHEATS={
 '돈벼락':'💰 돈 +10만','인구폭발':'👨‍👩‍👧 인구 2배','연구왕':'🔬 지금 연구 바로 완료','모든기술':'🧠 모든 기술 완료','자원풍부':'⛏️ 식량·철·석유 가득',
 '군대소환':'🪖 가장 센 부대들 소환','평화의비둘기':'🕊️ 모든 전쟁 끝내기','훈련끝':'⏩ 훈련 중인 부대 바로 완료','행복한나라':'😀 안정도 100','병사충전':'🪖 병사 인원 가득'};
function applyCheat(N,code,x){
 const T=N.techs;
 switch(code){
 case'돈벼락':N.money+=100000;break;case'인구폭발':N.pop*=2;N.mpMax=N.pop*50;break;
 case'연구왕':if(!N.res)return'먼저 연구할 기술을 골라 주세요';finishTech(N,N.res);break;
 case'모든기술':TECH_IDS.forEach(t=>T[t]=1);N.res=null;break;
 case'자원풍부':N.food=100+N.pop*3;N.iron=500+N.bld.mine*100;N.oil=500+N.bld.well*150;break;
 case'군대소환':['inf','sup','air','sea','mis'].forEach((c,i)=>{const k=bestUnits(N,c)[0];if(k!=null&&!(c==='sea'&&!N.coast))N.units[k]+=[30,15,10,6,4][i];});break;
 case'평화의비둘기':for(let j=1;j<G.nations.length;j++)if(G.war[N.id][j])makePeace(N.id,j);break;
 case'훈련끝':N.queue.forEach(q=>N.units[q.k]+=q.n);N.queue=[];break;
 case'행복한나라':N.stab=100;N.weary=0;break;case'병사충전':N.mp=N.mpMax;break;
 case'set':{const v=Number(x.v);if(!isFinite(v)||v<0)return'숫자를 확인해 주세요';const f=x.f;
  if(f==='money')N.money=v;else if(f==='pop'){N.pop=Math.max(0.01,v/100);N.mpMax=N.pop*50;}else if(f==='food')N.food=v;else if(f==='iron')N.iron=v;else if(f==='oil')N.oil=v;else if(f==='mp')N.mp=v/1000;else if(f==='dev')N.dev=clamp(v,0.1,5);
  else if(f==='res'){if(!N.res)return'먼저 연구할 기술을 골라 주세요';N.rp[N.res]=(N.rp[N.res]||0)+v;if(N.rp[N.res]>=TECH[N.res].cost)finishTech(N,N.res);}else return'모르는 항목이에요';break;}
 default:return'그런 치트는 없어요';}
 calcMil(N);return'✨ 치트 적용!';
}
function applyCmd(nid,a,x){
 const N=G.nations[nid];if(!N||!N.alive)return'우리나라가 없어요';x=x||{};

 }

 if(MAPDIRTY&&now-lastCache>250)redrawCache();
 const mw=W*V.z,mh=H*V.z;ctx.imageSmoothingEnabled=V.z<CPX;
 for(let k=-1;k<=2;k++){const x0=V.ox+k*mw;if(x0>CW||x0+mw<0)continue;ctx.drawImage(cache,x0,V.oy,mw,mh);}
 const ccx=c=>screenX((c%W)+.5),ccy=c=>V.oy+(((c/W)|0)+.5)*V.z;
 ctx.textAlign='center';ctx.textBaseline='middle';
 // 자원 아이콘 (크게 확대했을 때)
 if(V.z>=18){ctx.font=`${Math.round(V.z*0.42)}px sans-serif`;for(const i of LANDS){const x=ccx(i),y=ccy(i);if(x<-20||x>CW+20||y<-20||y>CH+20)continue;const f=RES[i];
  const ic=(f&4?'🛢️':'')+(f&2?'⛏️':'')+(f&8?'💰':'');if(ic)ctx.fillText(ic,x,y);}}
 // 전선 표시
 const blink=0.55+0.45*Math.sin(now/250);ctx.globalAlpha=blink;ctx.font=`${Math.max(11,Math.min(22,V.z*1.1))}px sans-serif`;
 for(const c of G.frontSample)ctx.fillText('⚔️',ccx(c),ccy(c));ctx.globalAlpha=1;
 // 공격 목표
 const me=G.nations[ME];if(me)for(const id in me.focus){const c=me.focus[id];ctx.font=`${Math.max(16,V.z*1.4)}px sans-serif`;ctx.fillText('🎯',ccx(c),ccy(c));}
 // 수도
 if(V.z>=3){ctx.font=`${Math.max(10,Math.min(20,V.z*1.1))}px sans-serif`;for(const N of G.nations){if(!N||!N.alive||N.cap<0)continue;ctx.fillText(N.id===ME?'👑':(G.sid==='med'?'🏰':'⭐'),ccx(N.cap),ccy(N.cap));}}
 // 이름
 for(const N of G.nations){if(!N||!N.alive||N._lx==null)continue;const fs=Math.min(30,Math.sqrt(N.cells)*V.z*0.42);if(fs<9&&N.id!==ME)continue;
  const x=screenX(N._lx),y=V.oy+N._ly*V.z+(V.z>=3?V.z*1.3:0);ctx.font=`900 ${Math.max(fs,10)}px sans-serif`;ctx.lineWidth=3.5;ctx.strokeStyle='rgba(255,255,255,.9)';
  const nm=(N.human&&N.id!==ME&&G.pl&&G.pl[N.id]?'🙂':'')+N.name;ctx.strokeText(nm,x,y);ctx.fillStyle=N.id===ME?'#b5560c':'#3a2e1f';ctx.fillText(nm,x,y);}
 // 선택
 if(UI.sel!=null){const x=screenX(UI.sel%W),y=V.oy+((UI.sel/W)|0)*V.z;ctx.strokeStyle='#ff3d7f';ctx.lineWidth=3;ctx.strokeRect(x,y,V.z,V.z);}
 // 효과
 G.fx=G.fx.filter(f=>now-f.t<2600);
 for(const f of G.fx){const age=now-f.t;
  if(f.k==='c'){if(age>1100)continue;ctx.globalAlpha=1-age/1100;ctx.font=`${Math.max(12,V.z*1.2)}px sans-serif`;ctx.fillText('✨',ccx(f.c),ccy(f.c)-age*0.02);ctx.globalAlpha=1;}
  else if(f.k==='m'){if(f.a<0)continue;const ax=ccx(f.a),ay=ccy(f.a),bx=ccx(f.b),by=ccy(f.b);const T=1400;
   if(age<T){const p=age/T,x=ax+(bx-ax)*p,y=ay+(by-ay)*p-Math.sin(p*Math.PI)*Math.min(160,Math.hypot(bx-ax,by-ay)*0.4);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(ax,ay);
    for(let q=0;q<=p;q+=0.05){ctx.lineTo(ax+(bx-ax)*q,ay+(by-ay)*q-Math.sin(q*Math.PI)*Math.min(160,Math.hypot(bx-ax,by-ay)*0.4));}ctx.stroke();ctx.setLineDash([]);
    ctx.font='22px sans-serif';ctx.fillText('🚀',x,y);}
   else{const p=(age-T)/1200;if(p>1)continue;ctx.globalAlpha=1-p;ctx.font=`${28+p*30}px sans-serif`;ctx.fillText(f.ok?'💥':'🛡️',bx,by);
    ctx.font='900 16px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#fff';const tx=f.ok?'펑!':'막았다!';ctx.strokeText(tx,bx,by-30-p*20);ctx.fillStyle=f.ok?'#e8484e':'#2a5fc4';ctx.fillText(tx,bx,by-30-p*20);ctx.globalAlpha=1;}}}
}

const PTR=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(PTR.size===1)drag={x:e.clientX,y:e.clientY,ox:V.ox,oy:V.oy,moved:false};
 else if(PTR.size===2){const[a,b]=[...PTR.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:V.z};drag=null;}});
cv.addEventListener('pointermove',e=>{if(!PTR.has(e.pointerId))return;PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&PTR.size===2){const[a,b]=[...PTR.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;zoomAt(pinch.z*d/pinch.d/V.z,mx,my);}
 else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;if(drag.moved){V.ox=drag.ox+dx;V.oy=drag.oy+dy;clampView();}}});
const endPtr=e=>{const wasTap=drag&&!drag.moved&&PTR.size===1;PTR.delete(e.pointerId);if(PTR.size<2)pinch=null;if(wasTap)onTap(e.clientX,e.clientY);if(PTR.size===0)drag=null;};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{PTR.delete(e.pointerId);drag=null;pinch=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);},{passive:false});
function zoomAt(f,cx,cy){const nz=clamp(V.z*f,zmin(),48);const k=nz/V.z;V.ox=cx-(cx-V.ox)*k;V.oy=cy-(cy-V.oy)*k;V.z=nz;clampView();}
function cellFromScreen(sx,sy){const y=Math.floor((sy-V.oy)/V.z);if(y<0||y>=H)return -1;let x=Math.floor((sx-V.ox)/V.z);x=((x%W)+W)%W;return y*W+x;}

function cliPriv(d){
 if(!G||d.to!==NET.myPeer||!ME)return;const N=G.nations[ME],s=d.s;if(!s)return;
 Object.assign(N,{money:s.m,food:s.f,iron:s.i,oil:s.o,pop:s.p,popCap:s.pc,mp:s.mp,mpMax:s.mx,tax:s.tx,stab:s.st,weary:s.wy,res:s.rs||null,cap:s.cap,colonize:!!s.cl,focus:s.fo||{},dev:s.dv,hungry:!!s.fl[0],broke:!!s.fl[1],oilShort:!!s.fl[2]});
 N.units=s.u;N.queue=s.q.map(q=>({k:q[0],n:q[1],left:q[2],tot:q[3]}));BLD_IDS.forEach((b,i)=>N.bld[b]=s.b[i]);N.techs={};TECH_IDS.forEach((t,i)=>{if(s.tc[i]==='1')N.techs[t]=1;});N.rp={};if(N.res)N.rp[N.res]=s.rp;
 const R=s.rt;N.rate={money:R[0],food:R[1],iron:R[2],oil:R[3],res:R[4],tax:R[5],fac:R[6],port:R[7],gold:R[8],up:R[9]};
 [N.cells,N.farmC,N.ironC,N.oilC,N.goldC,N.coast]=s.cn;
 String(s.rl).split(',').forEach((v,i)=>{G.rel[ME][i+1]=+v;});String(s.tr).split(',').forEach((v,i)=>{G.truce[ME][i+1]=G.day+(+v);});
 G.offers=(s.of||[]).map(o=>({id:o[0],from:o[1],to:ME,type:o[2],day:G.day}));N.auto=s.au||{};N.gain=s.gn||{};N._nbr=new Set(s.nb||[]);
 calcMil(N);
 if(Array.isArray(d.m))d.m.forEach(m=>toast(String(m).slice(0,120)));
 if(typeof d.a==='number'){const before=NET.cmds.length;NET.cmds=NET.cmds.filter(c=>c[0]>d.a);if(NET.cmds.length!==before)NET.nr.presence({cmds:NET.cmds}).catch(()=>{});}
 if(!N.alive&&!G.lostShown){G.lostShown=true;showModal(`<h2>😢 우리나라가 사라졌어요</h2><button class="btn big" onclick="hideModal();toMenu()">처음으로</button>`);}
}
function cliFull(d){
 if(!G||typeof d.s!=='string')return;const b=NET.buf[d.k]=NET.buf[d.k]||{n:d.n,p:{}};b.p[d.i]=d.s;
 if(Object.keys(b.p).length===b.n){let s='';for(let i=0;i<b.n;i++)s+=b.p[i];NET.buf={};unrleLand(s);
  for(const N of G.nations)if(N){N.cells=0;}for(const i of LANDS){const o=G.owner[i];if(o>0&&G.nations[o])G.nations[o].cells++;}
  MAPDIRTY=true;
  if(!NET.gotFull){NET.gotFull=true;NET.nr.presence({sync:null}).catch(()=>{});if(!ME){MENU.step='pick';UI.picking=true;UI.pickId=null;V.z=zmin()*1.6;clampView();$('#menu').style.display='flex';renderMenu();}}}
}

/* ---------------- 메인 루프 ---------------- */
let lastT=performance.now(),acc=0,uiT=0;
function loop(now){
 const dt=Math.min(0.25,(now-lastT)/1000);lastT=now;
 if(G&&NET.mode!=='client'&&!UI.picking&&ME){acc+=dt*SPEEDS[G.spd];let k=0;while(acc>=1&&k<6){simDay();acc-=1;k++;}if(acc>3)acc=0;}
 render(now);
 if(G&&now-uiT>500&&$('#menu').style.display==='none'){uiT=now;renderTop();renderPanel(false);if(UI.sel!=null&&now-UI.lastTouch>900)renderSheet();}
 requestAnimationFrame(loop);
}
buildWorld();resize();V.z=zmin()*1.3;V.oy=0;clampView();
renderMenu();requestAnimationFrame(loop);
</script>
